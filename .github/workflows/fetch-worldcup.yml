name: Auto-fetch World Cup fixtures

on:
  # Every 3 hours starting 06:00 BST — picks up new fixture stubs AND live
  # scores as openfootball updates score.ft after each match. No-ops cheaply
  # when nothing changes, so running frequently year-round is fine.
  schedule:
    - cron: '0 5 * * *'   # 06:00 BST
    - cron: '0 8 * * *'   # 09:00 BST
    - cron: '0 11 * * *'  # 12:00 BST
    - cron: '0 14 * * *'  # 15:00 BST
    - cron: '0 17 * * *'  # 18:00 BST
    - cron: '0 20 * * *'  # 21:00 BST
    - cron: '0 23 * * *'  # 00:00 BST
    - cron: '0 2 * * *'   # 03:00 BST
  workflow_dispatch:
    inputs:
      season:
        description: 'World Cup season year (default: 2026)'
        required: false
        default: '2026'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch World Cup fixtures
        env:
          # Data source is openfootball/worldcup.json on GitHub — no auth needed
          WC_SEASON: ${{ github.event.inputs.season || '2026' }}
        run: node scripts/fetch-worldcup.js
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git add index.html FEATURES.md
          git commit -m "auto-fetch: World Cup 2026 fixture stubs"
          git push
