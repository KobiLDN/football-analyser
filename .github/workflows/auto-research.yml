name: auto-research

on:
  # Daily at 10:00 UTC (11am BST) — picks up any new stubs from placeholder
  # resolution or overnight fixture fetches without waiting until Monday
  schedule:
    - cron: '0 10 * * *'
  # Run after the fetch workflows so stubs exist before we research them
  workflow_run:
    workflows:
      - "fetch-fixtures"
      - "fetch-worldcup"
    types: [completed]
  # Also allow manual trigger with optional overrides
  workflow_dispatch:
    inputs:
      league:
        description: 'League to research (blank = all)'
        required: false
        default: ''
      days:
        description: 'Days ahead to look for stubs (-1 = all pending)'
        required: false
        default: '7'
      batch_size:
        description: 'Fixtures per OpenRouter call (default 5)'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  research:
    # On workflow_run: only proceed if the upstream workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests understatapi

      - name: Research all stubs in batches
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          DAYS="${{ github.event.inputs.days || '7' }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size || '5' }}"
          LEAGUE="${{ github.event.inputs.league }}"

          ARGS="--no-apply --days $DAYS --max $BATCH_SIZE"
          if [ -n "$LEAGUE" ]; then ARGS="$ARGS --league $LEAGUE"; fi

          BATCH=0
          MAX_BATCHES=30
          while [ $BATCH -lt $MAX_BATCHES ]; do
            BATCH=$((BATCH + 1))
            echo ""
            echo "=== Batch $BATCH ==="

            python auto_research.py $ARGS

            if [ ! -f research.json ]; then
              echo "No more stubs — done after $((BATCH - 1)) batch(es)."
              break
            fi

            python apply_research.py --no-push

            if git diff --quiet; then
              echo "No changes to index.html — stopping."
              rm -f research.json
              break
            fi

            COUNT=$(python -c "import json; d=json.load(open('research.json')); print(len(d))" 2>/dev/null || echo "?")
            git add index.html
            git commit -m "auto-research: batch $BATCH ($COUNT fixture(s) via OpenRouter)"
            git push

            rm -f research.json
          done
