name: verify-fixtures

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/verify-fixtures.js'
      - '.github/workflows/verify-fixtures.yml'
  schedule:
    # Daily at 07:00 UTC — catches fixture changes ahead of the weekend
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run verification
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/verify-fixtures.js
      - name: Commit auto-corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo "No corrections — nothing to commit."
            exit 0
          fi
          git add index.html
          git commit -m "fix: auto-correct fixture dates/times from API verification"
          git push
