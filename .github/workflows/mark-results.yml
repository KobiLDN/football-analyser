name: Auto-mark results

on:
  schedule:
    # Match days afternoon — 5pm BST (16:00 UTC) catches afternoon kickoffs (Thu-Sun)
    - cron: '0 16 * * 4,5,6,0'
    # Daily 11pm BST (22:00 UTC) — catches evening kickoffs (20:00-21:00)
    - cron: '0 22 * * *'
    # Daily 2am BST (01:00 UTC) — catches late kickoffs (22:00-23:00) finished after midnight
    - cron: '0 1 * * *'
    # Daily 8am BST (07:00 UTC) — catches overnight kickoffs (00:00-05:00 BST)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mark finished results
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/mark-results.js
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git add index.html FEATURES.md
          git commit -m "auto-mark: results"
          git push
