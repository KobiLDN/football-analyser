<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Analyser</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1a1a1a;
  --border: #242424;
  --border2: #303030;
  --text: #e2e2e2;
  --text2: #888;
  --text3: #fff;
  --gold: #c8a84b;
  --gold-dim: #7a6228;
  --green: #4a9e6a;
  --amber: #c9792a;
  --red: #c94a4a;
  --blue: #4a7ec9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.logo span { color: var(--text3); font-weight: 400; margin-left: 10px; letter-spacing: 0.05em; }
.depth-badge { font-size: 10px; padding: 3px 10px; border: 1px solid var(--gold-dim); border-radius: 3px; color: var(--gold); letter-spacing: 0.1em; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.updated-stack { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.updated-tag { font-size: 10px; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; }
.toggle-pill { font-size: 9px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--border2); color: var(--text3); letter-spacing: 0.08em; }
.toggle-pill.on { color: var(--gold); border-color: var(--gold-dim); background: rgba(200, 168, 75, 0.08); }

/* Past-fixtures chip group (mutually-exclusive) */
.past-row { flex-direction: column; align-items: flex-start; gap: 6px; cursor: default; }
.past-row:hover { background: transparent; color: var(--text2); }
.past-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.past-chip {
  font-size: 9px;
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  color: var(--text3);
  letter-spacing: 0.08em;
  cursor: pointer;
  text-transform: uppercase;
  user-select: none;
}
.past-chip:hover { border-color: var(--gold-dim); }
.past-chip.on {
  color: var(--gold);
  border-color: var(--gold-dim);
  background: rgba(200, 168, 75, 0.12);
}

.layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 49px); }
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 49px;
  height: calc(100vh - 49px);
  overflow-y: auto;
}
.sidebar-section { margin-bottom: 6px; }
.sidebar-group-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text3);
  padding: 10px 20px 6px;
}
.sidebar-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 20px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
  border-left: 2px solid transparent;
}
.sidebar-item:hover { background: var(--surface2); color: var(--text); }
.sidebar-item.active { background: var(--surface2); color: var(--gold); border-left-color: var(--gold); }
.sidebar-badge {
  font-size: 10px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: 1px 6px;
  color: var(--text3);
}

.main { padding: 28px 32px; }
.league-header {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.league-header-left { display: flex; flex-direction: column; justify-content: center; }
.league-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
.league-name { font-size: 22px; font-weight: 700; }
.league-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.league-stats { display: flex; align-items: stretch; }
.stat-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 28px; border-left: 1px solid var(--border); text-align: center; min-width: 110px;
}
.stat-val { font-size: 26px; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-label { font-size: 9px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 5px; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; letter-spacing: 0.02em; }

.day-label {
  font-size: 10px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 10px;
  margin-top: 22px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.day-label:first-child { margin-top: 0; }
.day-label:hover { color: var(--gold); }
.day-chevron {
  display: inline-block;
  font-size: 8px;
  color: var(--text2);
  transition: transform 0.15s ease;
}
.day-group.collapsed .day-chevron { transform: rotate(-90deg); }
.day-group.collapsed .day-fixtures { display: none; }
.day-count {
  margin-left: auto;
  font-size: 9px;
  color: var(--text2);
  letter-spacing: 0.06em;
}

.fixture {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  margin-bottom: 7px;
  cursor: pointer;
  overflow: hidden;
}
.fixture:hover { border-color: var(--border2); }
.fixture.open { border-color: var(--gold-dim); }

.fixture-list-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 120px 100px 260px 110px 24px;
  align-items: end;
  gap: 20px;
  padding: 0 18px;
  margin: 0 0 10px;
}
.fixture-list-col {
  font-size: 10px;
  font-weight: 700;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.fixture-list-col.fixture-col { color: var(--text2); }
.fixture-list-col.metric,
.fixture-list-col.signal,
.fixture-list-col.research { text-align: center; }

.fixture-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 120px 100px 260px 110px 24px;
  align-items: center;
  gap: 20px;
  padding: 14px 18px;
}
.teams { font-size: 19px; font-weight: 600; }
.fixture-tag-cell { min-height: 22px; display: flex; align-items: center; justify-content: center; }
.kick-time { font-size: 13px; color: var(--text2); margin-top: 4px; }
.draw-probability-cell { display: block; min-width: 0; }
.legacy-prob { display: flex; align-items: center; justify-content: center; gap: 8px; }
.pct-display { font-size: 20px; font-weight: 700; min-width: 48px; text-align: right; }
.mini-bar-wrap { width: 70px; height: 3px; background: var(--border2); border-radius: 99px; overflow: hidden; }
.mini-bar { height: 100%; }
.prob-bar-wrap { width: 100%; }
.prob-cols { display: flex; margin-bottom: 7px; }
.prob-col { display: flex; flex-direction: column; align-items: center; min-width: 0; gap: 2px; }
.prob-col-label { font-size: 8px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }
.prob-col-pct { font-size: 13px; font-weight: 700; line-height: 1; }
.prob-col-pct.leading { font-size: 17px; }
.prob-col-pct.home { color: var(--blue); }
.prob-col-pct.draw-pct { color: var(--amber); }
.prob-col-pct.away { color: #e05252; }
.prob-bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; width: 100%; }
.prob-home { background: var(--blue); }
.prob-draw { background: var(--amber); }
.prob-away { background: #e05252; }
.vtag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 3px;
  min-width: 68px;
  text-align: center;
  justify-self: center;
}
.v-low    { color: var(--red);   background: #1c0505; border: 1px solid #3a1010; }
.v-likely { color: var(--amber); background: #1c1200; border: 1px solid #3a2800; }
.v-strong { color: #ffffff;      background: #000e1c; border: 1px solid #001c38; }
.vtag { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.vtag-outcome { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; }
.vtag-confidence { font-size: 8px; letter-spacing: 0.06em; opacity: 0.75; }
.bar-low    { background: var(--red); }
.bar-mod    { background: var(--amber); }
.bar-good   { background: var(--green); }
.bar-strong { background: var(--blue);  }
.chevron { font-size: 11px; color: var(--text3); margin-left: 2px; text-align: center; }
.fixture.open .chevron { transform: rotate(180deg); }

.analysis {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--surface2);
  padding: 18px 16px;
  overflow: hidden;
}
.fixture.open .analysis { display: block; }

.deep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px; }
.deep-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 14px;
  min-width: 0;
}
.deep-label {
  font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.deep-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.deep-content { font-size: 13px; color: var(--text); line-height: 1.6; overflow-wrap: anywhere; }
.deep-content ul { list-style: none; padding: 0; }
.deep-content li {
  font-size: 12px; color: var(--text2); padding: 3px 0;
  padding-left: 10px; position: relative;
}
.deep-content li::before {
  content: '•'; color: var(--text3);
  position: absolute; left: 0;
}
.deep-content .out { color: var(--red); font-weight: 500; }
.deep-content .doubt { color: var(--amber); font-weight: 500; }
.deep-content .key { color: var(--gold); font-weight: 500; }

.factors-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 16px; }
.factor {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 11px;
  min-width: 0;
}
.fn { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.fbar-wrap { height: 3px; background: var(--border2); border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
.fbar { height: 100%; background: var(--gold); }
.fnum { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.fdetail { font-size: 11px; color: var(--text2); line-height: 1.5; }

.summary-grid { display: grid; grid-template-columns: 1fr 140px; gap: 16px; align-items: start; }
.summary-text { font-size: 14px; color: var(--text2); line-height: 1.7; min-width: 0; overflow-wrap: anywhere; }
.odds-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 12px; text-align: center;
}
.odds-lbl { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
.fair-odds-lbl { color: #fff; }
.odds-val { font-size: 17px; font-weight: 700; color: var(--gold); }
.odds-sub { font-size: 10px; color: var(--text3); margin-top: 3px; }

.research-tag {
  display: inline-block; font-size: 9px; padding: 2px 6px;
  background: rgba(74, 126, 201, 0.1); border: 1px solid rgba(74, 126, 201, 0.3);
  color: var(--blue); border-radius: 3px; letter-spacing: 0.05em;
  vertical-align: middle;
}
.result-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; margin-left: 8px; vertical-align: middle; }
.league-tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 3px; vertical-align: middle; background: #1a1a2e; color: #6a8fc8; border: 1px solid #2a3a5a; letter-spacing: 0.04em; }
.value-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px; margin-left: 6px; vertical-align: middle; background: #001a08; color: var(--green); border: 1px solid #003018; letter-spacing: 0.08em; animation: pulse-value 2s ease-in-out infinite; }
@keyframes pulse-value { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
.book-row { display: flex; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.book-cell { flex: 1; }
.book-lbl { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
.book-num { font-size: 16px; font-weight: 700; }
.edge-pos { color: var(--green); }
.edge-neg { color: var(--red); }
.edge-nil { color: var(--text3); }
.score-line { font-size: 11px; color: var(--text2); letter-spacing: 0.04em; margin-top: 3px; }
.score-line .draw-tag { color: var(--gold); font-weight: 700; }
.score-line .home-tag { color: var(--blue); font-weight: 700; }
.score-line .away-tag { color: #e05252;    font-weight: 700; }
.acc-badge {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 1px 6px;
  border-radius: 3px;
  vertical-align: 1px;
}
.acc-hit  { color: var(--green); background: rgba(74, 158, 106, 0.12); border: 1px solid rgba(74, 158, 106, 0.35); }
.acc-miss { color: var(--red);   background: rgba(201, 74, 74, 0.10);  border: 1px solid rgba(201, 74, 74, 0.30); }
.live-link {
  color: var(--text3);
  text-decoration: none;
  letter-spacing: 0.04em;
  opacity: 0.7;
  transition: opacity 0.15s, color 0.15s;
}
.live-link:hover { color: var(--gold); opacity: 1; }

/* Form dots */
.form-row { display: flex; align-items: center; gap: 5px; margin-top: 4px; }
.form-group { display: flex; gap: 3px; align-items: center; }
.form-sep { width: 1px; height: 9px; background: var(--border2); margin: 0 2px; flex-shrink: 0; }
.form-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot-w { background: var(--green); }
.dot-d { background: var(--amber); }
.dot-l { background: var(--red); }

@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .topbar { padding: 10px 16px; }
  .updated-stack { display: none; }
  .main { padding: 16px 12px; }
  .sidebar { position: static; height: auto; display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; gap: 6px; padding: 10px 12px; border-right: none; border-bottom: 1px solid var(--border); }
  .sidebar::-webkit-scrollbar { display: none; }
  .sidebar-section { display: flex; flex-wrap: nowrap; flex-shrink: 0; gap: 6px; }
  .sidebar-group-label { display: none; }
  .sidebar-item { border-left: none; border-radius: 4px; border: 1px solid var(--border); padding: 7px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .league-header { flex-direction: column; gap: 14px; }
  .league-stats { border-top: 1px solid var(--border); padding-top: 14px; }
  .stat-card { min-width: 0; padding: 0 20px; }
  .stat-card:first-child { padding-left: 0; border-left: none; }
  .factors-row { grid-template-columns: repeat(2, 1fr); }
  .deep-grid { grid-template-columns: 1fr; }
  .fixture-list-head { display: none; }
  .fixture-row { grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 12px; }
  .fixture-tag-cell { display: none; }
  .mini-bar-wrap { display: none; }
  .teams { font-size: 15px; }
  .team-home { display: block; }
  .team-away { display: block; }
  .vtag { min-width: 90px; }
  .prob-col-label { display: none; }
  .prob-cols { gap: 6px; }
  .prob-col-pct.leading { font-size: 13px; }
  .draw-probability-cell { justify-content: flex-end; }
  .chevron { display: none; }
  .summary-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Football Analyser <span>v2.62 – 2025–26</span></div>
  <div class="topbar-right">
    <div class="updated-stack">
      <div class="updated-tag">Page · 31 May 2026 20:00 BST</div>
      <div class="updated-tag">Data · 17 Jun 2026 13:52 BST</div>
    </div>
    
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

// RENDER
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
let activeId = 'all';
// 'off' | '2d' | 'week' | 'all'  — chip group, mutually exclusive
let pastWindow = 'off';
// Multi-select Set. 'all' is a sentinel meaning "no filter".
// Mutually exclusive with the tier chips: clicking a tier removes 'all',
// clicking 'all' clears the tiers. Empty set auto-resets to {'all'}.
let signalFilter = new Set(['all']);

function pastCutoffTs() {
  if (pastWindow === 'off')  return todayTs;                       // no past at all
  if (pastWindow === 'all')  return -Infinity;                     // every past fixture
  const days = pastWindow === '2d' ? 2 : 7;
  return todayTs - days * 24 * 60 * 60 * 1000;
}

function passesSignal(f) {
  if (signalFilter.has('all')) return true;
  const conf = calcConfidence(f).toLowerCase();   // 'strong' | 'likely' | 'low'
  return signalFilter.has(conf);
}

function calcOutcome(f) {
  if (f.homeWin !== undefined) {
    const top = Math.max(f.homeWin, f.draw, f.awayWin);
    if (f.homeWin === top) return 'Home Win';
    if (f.draw === top) return 'Draw';
    return 'Away Win';
  }
  return 'Draw';
}
function calcConfidence(f) {
  if (f.homeWin !== undefined) {
    const top = Math.max(f.homeWin, f.draw, f.awayWin);
    if (top >= 65) return 'Strong';
    if (top >= 50) return 'Likely';
    return 'Low';
  }
  const p = f.drawProbability || 0;
  if (p >= 65) return 'Strong';
  if (p >= 50) return 'Likely';
  return 'Low';
}
function verdictClass(confidence) {
  return { Low: 'v-low', Likely: 'v-likely', Strong: 'v-strong' }[confidence] || 'v-low';
}
function barClass(confidence) {
  return { Low: 'bar-low', Likely: 'bar-mod', Strong: 'bar-strong' }[confidence] || 'bar-low';
}
const MONTHS = {January:0,February:1,March:2,April:3,May:4,June:5,July:6,August:7,September:8,October:9,November:10,December:11};
function dayToTs(dayStr) {
  const p = dayStr.split(' '); // ["Thursday", "7", "May"]
  return new Date(2026, MONTHS[p[2]], parseInt(p[1])).getTime();
}
const todayTs = new Date(new Date().setHours(0,0,0,0)).getTime();
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function dateRangeLabel(fixtures) {
  const dates = fixtures.map(f => dayToTs(f.day)).filter(Boolean);
  if (!dates.length) return 'Upcoming Fixtures';
  const min = new Date(Math.min(...dates));
  const max = new Date(Math.max(...dates));
  const d1 = min.getDate(), m1 = MONTH_NAMES[min.getMonth()], y1 = min.getFullYear();
  const d2 = max.getDate(), m2 = MONTH_NAMES[max.getMonth()], y2 = max.getFullYear();
  if (d1 === d2 && m1 === m2) return `${d1} ${m1} ${y1}`;
  if (m1 === m2) return `${d1} – ${d2} ${m1} ${y1}`;
  if (y1 === y2) return `${d1} ${m1} – ${d2} ${m2} ${y1}`;
  return `${d1} ${m1} ${y1} – ${d2} ${m2} ${y2}`;
}

function parseFairMid(str) {
  if (!str) return null;
  const parts = str.split('–').map(s => parseFloat(s.trim()));
  if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return (parts[0] + parts[1]) / 2;
}
function calcEdge(fairOddsStr, bookOdds) {
  const mid = parseFairMid(fairOddsStr);
  if (!mid || !bookOdds) return null;
  return ((bookOdds / mid) - 1) * 100;
}

// Returns 'hit' | 'miss' | null. Compares the predicted leading outcome
// against the actual outcome. Low-confidence picks return null (no badge).
function predictionAccuracy(f) {
  if (!f.result || !f.result.includes('-')) return null;
  const conf = calcConfidence(f);
  if (conf === 'Low') return null;
  const [h, a] = f.result.split('-').map(Number);
  const actual = h > a ? 'Home Win' : h < a ? 'Away Win' : 'Draw';
  return calcOutcome(f) === actual ? 'hit' : 'miss';
}

// Aggregate hit / miss across a list of fixtures.
// Returns { hits, misses, total, percent } or null when nothing graded.
function calcHitRate(fixtures) {
  let hits = 0, misses = 0;
  for (const f of fixtures) {
    const r = predictionAccuracy(f);
    if (r === 'hit') hits++;
    else if (r === 'miss') misses++;
  }
  const total = hits + misses;
  if (total === 0) return null;
  return { hits, misses, total, percent: Math.round((hits / total) * 100) };
}

function renderFormDots(formStr) {
  if (!formStr) return '';
  return formStr.trim().split(/\s+/).slice(-5).map(r => {
    const cls = r === 'W' ? 'dot-w' : r === 'D' ? 'dot-d' : 'dot-l';
    const title = r === 'W' ? 'Win' : r === 'D' ? 'Draw' : 'Loss';
    return `<span class="form-dot ${cls}" title="${title}"></span>`;
  }).join('');
}

function renderFixture(f, key, leagueName) {
  const outcome = calcOutcome(f);
  const confidence = calcConfidence(f);
  const vc = verdictClass(confidence);
  const bc = barClass(confidence);
  const factorNames = {
    formBalance: 'Form balance', momentum: 'Momentum', drawRates: 'Momentum',
    headToHead: 'Head to head', goalTendency: 'Goal tendency', leagueContext: 'Context'
  };
  const factorsHTML = Object.entries(f.factors).map(([k, v]) => `
    <div class="factor">
      <div class="fn">${factorNames[k] || k}</div>
      <div class="fbar-wrap"><div class="fbar" style="width:${v.score}%"></div></div>
      <div class="fnum">${v.score}</div>
      <div class="fdetail">${v.detail}</div>
    </div>
  `).join('');

  const teamNewsBlock = f.teamNews ? `
    <div class="deep-grid">
      <div class="deep-card">
        <div class="deep-label">${f.home} — Team News</div>
        ${renderTeamNews(f.teamNews.home)}
      </div>
      <div class="deep-card">
        <div class="deep-label">${f.away} — Team News</div>
        ${renderTeamNews(f.teamNews.away)}
      </div>
    </div>
    ${f.context ? `<div class="deep-card" style="margin-bottom:16px;">
      <div class="deep-label">Context & Tactical Read</div>
      <div class="deep-content" style="font-size:12px;line-height:1.7;">${f.context}</div>
    </div>` : ''}
  ` : '';

  const leagueTag = leagueName ? `<span class="league-tag">${leagueName}</span>` : '';
  const researchBadge = f.teamNews ? '<span class="research-tag">RESEARCHED</span>' : '';
  const edge = calcEdge(f.fairOdds, f.bookOdds);
  const valueBadge = (f.bookOdds && edge !== null && edge >= 5) ? `<span class="value-badge">VALUE ${f.bookOdds.toFixed(2)}</span>` : (f.bookOdds && edge !== null && edge > 0) ? `<span class="value-badge" style="opacity:0.7;">EDGE ${f.bookOdds.toFixed(2)}</span>` : '';

  const homeDots = renderFormDots(f.homeForm);
  const awayDots = renderFormDots(f.awayForm);
  const formRowHTML = (homeDots || awayDots) ? `<div class="form-row"><div class="form-group">${homeDots}</div>${homeDots && awayDots ? '<div class="form-sep"></div>' : ''}<div class="form-group">${awayDots}</div></div>` : '';

  // Google search link — opens "Home vs Away" results in a new tab.
  // stopPropagation so the click doesn't toggle the fixture expand.
  const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(f.home + ' vs ' + f.away)}`;
  const linkLabel = f.result ? 'Match report' : 'Score';
  const liveLink = ` · <a href="${searchUrl}" target="_blank" rel="noopener noreferrer"
                          class="live-link" onclick="event.stopPropagation()">🔗 ${linkLabel}</a>`;

  // Per-fixture HIT / MISS badge — Low confidence picks get no badge.
  const acc = predictionAccuracy(f);
  const accBadge = acc === 'hit'  ? ` · <span class="acc-badge acc-hit">✅ HIT</span>`
                 : acc === 'miss' ? ` · <span class="acc-badge acc-miss">❌ MISS</span>`
                 : '';

  let bottomLine;
  if (f.result) {
    if (f.result.includes('-')) {
      const [h, a] = f.result.split('-').map(Number);
      const outcomeCls = h === a ? 'draw-tag' : h > a ? 'home-tag' : 'away-tag';
      const outcomeLbl = h === a ? 'Draw'     : h > a ? 'Home Win' : 'Away Win';
      const outcomeTag = ` · <span class="${outcomeCls}">${outcomeLbl}</span>`;
      bottomLine = `<div class="score-line">Final Score: ${h} – ${a}${outcomeTag}${accBadge}${liveLink}</div>`;
    } else {
      const label = f.result === 'draw' ? 'DRAW' : f.result === 'home' ? 'Home Win' : 'Away Win';
      bottomLine = `<div class="score-line">${label}${accBadge}${liveLink}</div>`;
    }
  } else {
    bottomLine = `<div class="kick-time">${f.time} kick-off${liveLink}</div>`;
  }

  return `
    <div class="fixture" id="fix-${key}" onclick="toggleFixture('fix-${key}')">
      <div class="fixture-row">
        <div>
          <div class="teams"><span class="team-home">${f.home} vs</span> <span class="team-away">${f.away}${valueBadge}</span></div>
          ${formRowHTML}
          ${bottomLine}
        </div>
        <div class="fixture-tag-cell">${leagueTag}</div>
        <div class="fixture-tag-cell">${researchBadge}</div>
        <div class="draw-probability-cell">
          ${f.homeWin !== undefined
            ? (() => { const top = Math.max(f.homeWin, f.draw, f.awayWin); return `<div class="prob-bar-wrap">
                <div class="prob-cols">
                  <div class="prob-col" style="flex:1">
                    <span class="prob-col-label">${f.home}</span>
                    <span class="prob-col-pct home${f.homeWin === top ? ' leading' : ''}">${f.homeWin}%</span>
                  </div>
                  <div class="prob-col" style="flex:1">
                    <span class="prob-col-label">Draw</span>
                    <span class="prob-col-pct draw-pct${f.draw === top ? ' leading' : ''}">${f.draw}%</span>
                  </div>
                  <div class="prob-col" style="flex:1">
                    <span class="prob-col-label">${f.away}</span>
                    <span class="prob-col-pct away${f.awayWin === top ? ' leading' : ''}">${f.awayWin}%</span>
                  </div>
                </div>
                <div class="prob-bar">
                  <div class="prob-home" style="flex:${f.homeWin}"></div>
                  <div class="prob-draw" style="flex:${f.draw}"></div>
                  <div class="prob-away" style="flex:${f.awayWin}"></div>
                </div>
               </div>`; })()
            : `<div class="legacy-prob">
                 <div class="pct-display" style="color:${confidence==='Strong'?'var(--blue)':confidence==='Likely'?'var(--amber)':'var(--red)'}">${f.drawProbability}%</div>
                 <div class="mini-bar-wrap"><div class="mini-bar ${bc}" style="width:${f.drawProbability}%"></div></div>
               </div>`
          }
        </div>
        <div class="vtag ${vc}"><span class="vtag-outcome">${outcome}</span><span class="vtag-confidence">${confidence}</span></div>
        <div class="chevron">▼</div>
      </div>
      <div class="analysis">
        ${teamNewsBlock}
        <div class="factors-row">${factorsHTML}</div>
        <div class="summary-grid">
          <div class="summary-text">${f.summary}</div>
          <div class="odds-box">
            <div class="odds-lbl fair-odds-lbl">Fair draw odds</div>
            <div class="odds-val">${f.fairOdds}</div>
            <div class="odds-sub">researched range</div>
            ${f.bookOdds && edge !== null ? `
            <div class="book-row">
              <div class="book-cell">
                <div class="book-lbl">Book price</div>
                <div class="book-num ${edge >= 5 ? 'edge-pos' : edge > 0 ? 'edge-pos' : 'edge-neg'}">${f.bookOdds.toFixed(2)}</div>
              </div>
              <div class="book-cell" style="text-align:right">
                <div class="book-lbl">Edge</div>
                <div class="book-num ${edge >= 5 ? 'edge-pos' : edge > 0 ? 'edge-pos' : 'edge-neg'}">${edge >= 0 ? '+' : ''}${edge.toFixed(1)}%</div>
              </div>
            </div>` : `<div class="odds-sub" style="margin-top:6px;font-style:italic;">Add bookOdds to fixture</div>`}
          </div>
        </div>
      </div>
    </div>`;
}

function toggleFixture(id) {
  document.getElementById(id).classList.toggle('open');
}

function setLeague(id) {
  activeId = id;
  renderSidebar();
  renderMain();
}

function setPastWindow(w) {
  if (!['off','2d','week','all'].includes(w)) return;
  pastWindow = w;
  renderSidebar();
  renderMain();
}

function toggleSignalFilter(s) {
  if (!['all','strong','likely','low'].includes(s)) return;
  if (s === 'all') {
    // 'All' is exclusive: clear everything else, just keep 'all'
    signalFilter = new Set(['all']);
  } else {
    // Toggling a tier auto-removes 'all'
    signalFilter.delete('all');
    if (signalFilter.has(s)) signalFilter.delete(s);
    else                     signalFilter.add(s);
    // Empty selection falls back to 'all' so something is always shown
    if (signalFilter.size === 0) signalFilter.add('all');
  }
  renderSidebar();
  renderMain();
}

function toggleDay(el) {
  el.closest('.day-group').classList.toggle('collapsed');
}

renderSidebar();
renderMain();
</script>

</body>
</html>
