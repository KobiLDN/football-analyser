name: refresh-tonight

on:
  # Midnight BST (23:00 UTC) — re-researches fixtures kicking off today or
  # tomorrow with the latest team news, injuries, and lineup leaks
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days ahead to refresh (default 2 = today + tomorrow)'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests understatapi

      - name: Reset upcoming fixtures to stubs
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          python refresh_today.py --days $DAYS --no-research

      - name: Re-research stubs via OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          DAYS="${{ github.event.inputs.days || '2' }}"

          BATCH=0
          MAX_BATCHES=20
          while [ $BATCH -lt $MAX_BATCHES ]; do
            BATCH=$((BATCH + 1))
            echo "=== Batch $BATCH ==="

            python auto_research.py --no-apply --days $DAYS --max 5

            if [ ! -f research.json ]; then
              echo "No more stubs — done after $((BATCH - 1)) batch(es)."
              break
            fi

            python apply_research.py --no-push

            if git diff --quiet; then
              echo "No changes — stopping."
              rm -f research.json
              break
            fi

            COUNT=$(python -c "import json; d=json.load(open('research.json')); print(len(d))" 2>/dev/null || echo "?")
            git add index.html
            git commit -m "midnight-refresh: batch $BATCH ($COUNT fixture(s) refreshed)"
            git push

            rm -f research.json
          done
